<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>리뷰클리어 · 후불제 구글 리뷰 삭제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block" rel="stylesheet">
<style>/* ===== Material Design 3 tokens (Google-blue scheme) ===== */
:root{
  --md-primary:#0B57D0;--md-on-primary:#FFFFFF;--md-primary-container:#D3E3FD;--md-on-primary-container:#041E49;
  --md-secondary:#00639B;--md-on-secondary:#FFFFFF;--md-secondary-container:#C2E7FF;--md-on-secondary-container:#001D35;
  --md-tertiary:#146C2E;--md-on-tertiary:#FFFFFF;--md-tertiary-container:#C4EED0;--md-on-tertiary-container:#072711;
  --md-error:#B3261E;--md-on-error:#FFFFFF;--md-error-container:#F9DEDC;--md-on-error-container:#410E0B;
  --md-surface:#FFFFFF;--md-surface-dim:#D3DBE5;--md-surface-container-lowest:#FFFFFF;--md-surface-container-low:#F0F4F9;--md-surface-container:#E9EEF6;--md-surface-container-high:#DDE3EA;--md-surface-container-highest:#D3DBE5;
  --md-on-surface:#1F1F1F;--md-on-surface-variant:#444746;--md-outline:#747775;--md-outline-variant:#C4C7C5;
  --md-inverse-surface:#303030;--md-inverse-on-surface:#F2F2F2;--md-inverse-primary:#A8C7FA;
  --g-blue:#4285F4;--g-red:#EA4335;--g-yellow:#FBBC04;--g-green:#34A853;
  --md-warn:#7A4F00;--md-warn-container:#FFDF9E;
  --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--e2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);--e3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
  --sh-xs:4px;--sh-sm:8px;--sh-md:12px;--sh-lg:16px;--sh-xl:28px;
  /* legacy aliases used by templates */
  --bg:var(--md-surface);--bg-2:var(--md-surface-container-low);--bg-3:var(--md-surface-container);
  --ink:var(--md-on-surface);--ink-2:var(--md-on-surface-variant);--ink-3:var(--md-on-surface-variant);--ink-4:var(--md-outline);
  --line:var(--md-outline-variant);--line-2:var(--md-outline);
  --pink:var(--md-primary);--pink-ink:var(--md-primary);--pink-10:var(--md-primary-container);--pink-20:rgba(11,87,208,.24);
  --indigo:var(--md-primary);--indigo-2:var(--md-secondary);--indigo-10:var(--md-secondary-container);--indigo-20:rgba(0,99,155,.2);
  --brand-ink:var(--md-primary);--btn-tonal:var(--md-primary);--focus:var(--md-primary);--on-indigo:var(--md-on-surface);--on-indigo-2:var(--md-on-surface-variant);
  --good:var(--md-tertiary);--good-bg:var(--md-tertiary-container);--warn:var(--md-warn);--warn-bg:var(--md-warn-container);--bad:var(--md-error);--bad-bg:var(--md-error-container);--info:var(--md-secondary);--info-bg:var(--md-secondary-container);--muted-bg:var(--md-surface-container-high);
  --shadow:var(--e1);--r:12px;
  --font:Roboto,"Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;--serif:var(--font);--mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --md-primary:#A8C7FA;--md-on-primary:#062E6F;--md-primary-container:#0842A0;--md-on-primary-container:#D3E3FD;
  --md-secondary:#7FCFFF;--md-on-secondary:#003355;--md-secondary-container:#004A77;--md-on-secondary-container:#C2E7FF;
  --md-tertiary:#6DD58C;--md-on-tertiary:#0A3818;--md-tertiary-container:#0F5223;--md-on-tertiary-container:#C4EED0;
  --md-error:#F2B8B5;--md-on-error:#601410;--md-error-container:#8C1D18;--md-on-error-container:#F9DEDC;
  --md-surface:#131314;--md-surface-dim:#131314;--md-surface-container-lowest:#0E0E0F;--md-surface-container-low:#1B1B1C;--md-surface-container:#1E1F20;--md-surface-container-high:#282A2C;--md-surface-container-highest:#333537;
  --md-on-surface:#E3E3E3;--md-on-surface-variant:#C4C7C5;--md-outline:#8E918F;--md-outline-variant:#444746;
  --md-inverse-surface:#E3E3E3;--md-inverse-on-surface:#303030;--md-inverse-primary:#0B57D0;
  --md-warn:#FFDF9E;--md-warn-container:#5C3B00;--pink-20:rgba(168,199,250,.3);--indigo-20:rgba(127,207,255,.25);
}}
:root[data-theme="dark"]{
  --md-primary:#A8C7FA;--md-on-primary:#062E6F;--md-primary-container:#0842A0;--md-on-primary-container:#D3E3FD;
  --md-secondary:#7FCFFF;--md-on-secondary:#003355;--md-secondary-container:#004A77;--md-on-secondary-container:#C2E7FF;
  --md-tertiary:#6DD58C;--md-on-tertiary:#0A3818;--md-tertiary-container:#0F5223;--md-on-tertiary-container:#C4EED0;
  --md-error:#F2B8B5;--md-on-error:#601410;--md-error-container:#8C1D18;--md-on-error-container:#F9DEDC;
  --md-surface:#131314;--md-surface-dim:#131314;--md-surface-container-lowest:#0E0E0F;--md-surface-container-low:#1B1B1C;--md-surface-container:#1E1F20;--md-surface-container-high:#282A2C;--md-surface-container-highest:#333537;
  --md-on-surface:#E3E3E3;--md-on-surface-variant:#C4C7C5;--md-outline:#8E918F;--md-outline-variant:#444746;
  --md-inverse-surface:#E3E3E3;--md-inverse-on-surface:#303030;--md-inverse-primary:#0B57D0;
  --md-warn:#FFDF9E;--md-warn-container:#5C3B00;--pink-20:rgba(168,199,250,.3);--indigo-20:rgba(127,207,255,.25);
}
/* ===== base ===== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--md-surface);color:var(--md-on-surface);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--md-primary)}
button{font:inherit;cursor:pointer}
.btn,button,summary,a{touch-action:manipulation}
:focus-visible{outline:3px solid var(--pink-20);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;font-weight:500}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
.muted{color:var(--md-on-surface-variant)}
.small{font-size:13px}
.mini{font-size:12px;color:var(--md-on-surface-variant)}
.hidden{display:none!important}
.msym{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;overflow:hidden;max-width:1.2em}
.msym.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.msym.s18{font-size:18px}.msym.s20{font-size:20px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--md-primary);color:var(--md-on-primary);padding:8px 12px;border-radius:8px;z-index:70}.skip:focus{left:8px}
@media (max-width:600px){body{font-size:16px}}
#order-form,#status-lookup,#risk{scroll-margin-top:calc(var(--pb-h,34px) + 76px)}

/* ===== prototype bar ===== */
#protobar{position:sticky;top:0;z-index:50;background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 16px}
#protobar .tag{background:var(--g-yellow);color:#1F1F1F;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.04em;font-size:11px}
#protobar nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
#protobar nav a{color:var(--md-inverse-on-surface);opacity:.85;text-decoration:none;padding:4px 10px;border-radius:999px}
#protobar nav a.on{opacity:1;background:rgba(255,255,255,.16)}
#protobar button{background:transparent;color:var(--md-inverse-on-surface);opacity:.85;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;font-size:12px}
@media (max-width:600px){#protobar{font-size:11.5px;padding:6px 12px}#protobar nav a{padding:3px 6px}}

/* ===== top app bar ===== */
.topbar{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;background:var(--md-surface);position:sticky;top:var(--pb-h,34px);z-index:40;border-bottom:1px solid var(--md-outline-variant)}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:20px;letter-spacing:0;color:var(--md-on-surface);text-decoration:none}
.wordmark .pin{color:var(--g-red);font-size:26px;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.wordmark small{font-weight:500;color:var(--md-on-surface-variant);font-size:11px;padding:2px 8px;border:1px solid var(--md-outline-variant);border-radius:999px;margin-left:2px}
.topbar .sep{width:1px;height:24px;background:var(--md-outline-variant)}
.topbar .pagename{font-size:16px;font-weight:500;color:var(--md-on-surface-variant);white-space:nowrap}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--md-on-surface-variant)}
@media (max-width:600px){.topbar{gap:8px;padding:0 12px}.topbar .sep,.topbar .right .muted,.topbar .right .sep{display:none}.wordmark small{display:none}.topbar .pagename{display:none}}
.gdots{display:inline-flex;gap:6px;align-items:center;margin-bottom:14px}
.gdots i{width:10px;height:10px;border-radius:50%;display:inline-block}
.gdots .b{background:var(--g-blue)}.gdots .r{background:var(--g-red)}.gdots .y{background:var(--g-yellow)}.gdots .g{background:var(--g-green)}

/* ===== layout ===== */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.wrap-n{max-width:760px;margin:0 auto;padding:0 24px}
.section{padding:64px 0}
.section h2{font-size:32px;font-weight:500;letter-spacing:0;margin-bottom:10px;line-height:1.25}
@media (max-width:600px){.section h2{font-size:26px}}
.section .lead{color:var(--md-on-surface-variant);max-width:62ch;font-size:16px;line-height:1.6}
.eyebrow{font-size:14px;font-weight:500;letter-spacing:.1px;color:var(--md-primary);margin-bottom:8px;display:inline-flex;align-items:center;gap:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ===== buttons (MD3) ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.1px;border:1px solid transparent;text-decoration:none;line-height:1;white-space:nowrap;overflow:hidden;transition:background-color .2s,color .2s,box-shadow .2s,border-color .2s;cursor:pointer}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:hover::before{opacity:.08}.btn:active::before{opacity:.12}
.btn .msym{font-size:18px}
.btn-filled{background:var(--md-primary);color:var(--md-on-primary)}
.btn-filled:hover{box-shadow:var(--e1)}
.btn-tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn-tonal-tertiary{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.btn-outlined{background:transparent;color:var(--md-primary);border-color:var(--md-outline)}
.btn-text{background:transparent;color:var(--md-primary);padding:0 12px}
.btn-sm{height:36px;padding:0 16px;font-size:13.5px}
.btn:disabled{background:rgba(31,31,31,.12);color:rgba(31,31,31,.38);border-color:transparent;cursor:not-allowed;box-shadow:none}
:root[data-theme="dark"] .btn:disabled{background:rgba(227,227,227,.12);color:rgba(227,227,227,.38)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:disabled{background:rgba(227,227,227,.12);color:rgba(227,227,227,.38)}}
@media (pointer:coarse){.btn{min-height:44px}.btn-sm{min-height:44px}.tabs button{min-height:44px}.sheet .rm{min-height:44px}.sheet input{height:44px}}

/* ===== chips (status) ===== */
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.pill.requested{background:var(--md-surface-container-high);color:var(--md-on-surface-variant);border-color:var(--md-outline-variant)}
.pill.accepted{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.pill.done_claimed{background:var(--md-warn-container);color:var(--md-warn)}
.pill.not_removed{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.pill.verified{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.pill.rejected{background:transparent;color:var(--md-on-surface-variant);border-color:var(--md-outline-variant)}
.pill.neutral{background:var(--md-surface-container-high);color:var(--md-on-surface-variant)}
.pill.pink{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.chk{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--md-outline-variant);color:var(--md-on-surface-variant);margin-right:4px}

/* ===== cards ===== */
.card{background:var(--md-surface-container-low);border-radius:var(--sh-md);border:0;box-shadow:var(--e1)}
.card.outlined{background:var(--md-surface);box-shadow:none;border:1px solid var(--md-outline-variant)}
.card.pad{padding:20px 22px}
.note{padding:12px 16px;border-radius:var(--sh-sm);font-size:14px;line-height:1.55}
.note.info{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.note.warn{background:var(--md-warn-container);color:var(--md-warn)}
.note.good{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.note.indigo{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-h h3{font-size:18px;font-weight:500}
.sec-h .hint{color:var(--md-on-surface-variant);font-size:13px}
.empty{padding:26px;text-align:center;color:var(--md-on-surface-variant);border:1px dashed var(--md-outline-variant);border-radius:var(--sh-md);font-size:14px}

/* ===== KPI tiles ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}
.kpi{padding:16px 18px;border-radius:var(--sh-md);background:var(--md-surface-container)}
.kpi .l{font-size:12.5px;color:var(--md-on-surface-variant);font-weight:500;letter-spacing:.3px}
.kpi .v{font-size:28px;font-weight:500;letter-spacing:0;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--md-on-surface)}
.kpi .s{font-size:12.5px;color:var(--md-on-surface-variant);margin-top:2px}
.kpi.pink .v{color:var(--md-primary)}.kpi.good .v{color:var(--md-tertiary)}.kpi.warn .v{color:var(--md-warn)}.kpi.bad .v{color:var(--md-error)}

/* ===== tabs (MD3 primary tabs) ===== */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--md-outline-variant);margin:18px 0 14px;flex-wrap:wrap}
.tabs button{position:relative;background:transparent;border:0;height:48px;padding:0 16px;font-weight:500;font-size:14px;color:var(--md-on-surface-variant);letter-spacing:.1px}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:transparent}
.tabs button.on{color:var(--md-primary)}.tabs button.on::after{background:var(--md-primary)}
.tabs button:hover{background:rgba(31,31,31,.06)}
.tabs .cnt{display:inline-block;margin-left:6px;background:var(--md-surface-container-high);color:var(--md-on-surface-variant);border-radius:999px;padding:0 7px;font-size:11.5px}

/* ===== tables ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--md-outline-variant);border-radius:var(--sh-md);background:var(--md-surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12.5px;letter-spacing:.3px;color:var(--md-on-surface-variant);font-weight:500;padding:0 16px;height:56px;border-bottom:1px solid var(--md-outline-variant);background:var(--md-surface);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--md-outline-variant);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--md-surface-container-low)}
td .sub{color:var(--md-on-surface-variant);font-size:12.5px;margin-top:2px}
.sheet-wrap{overflow-x:auto;border:1px solid var(--md-outline-variant);border-radius:var(--sh-md);background:var(--md-surface)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;min-width:680px}
.sheet th{height:48px;padding:0 12px;background:var(--md-surface-container-low);border-right:1px solid var(--md-outline-variant);border-bottom:1px solid var(--md-outline-variant);text-align:left}
.sheet td{padding:0;border-right:1px solid var(--md-outline-variant);border-bottom:1px solid var(--md-outline-variant);vertical-align:middle;height:44px}
.sheet td.c{padding:8px 12px;line-height:1.45}
.sheet th:last-child,.sheet td:last-child{border-right:none}
.sheet tbody tr:last-child td{border-bottom:none}
.sheet td.n,.sheet th.n{width:44px;text-align:center;color:var(--md-on-surface-variant);background:var(--md-surface-container-low);font-variant-numeric:tabular-nums;padding:6px 4px}
.sheet input{width:100%;height:44px;border:0;background:transparent;padding:6px 12px;font:inherit;font-size:14px;color:var(--md-on-surface);outline:none;border-radius:0}
.sheet input:focus{box-shadow:inset 0 0 0 2px var(--md-primary);background:var(--md-surface)}
.sheet td.invalid input{box-shadow:inset 0 0 0 2px var(--md-error);background:var(--md-error-container)}
.sheet input.link,.sheet a.link{font-family:var(--mono);font-size:12.5px}
.sheet a.link{overflow-wrap:anywhere}
.sheet tbody tr:hover td{background:var(--md-surface-container-low)}
.sheet .rm{background:transparent;border:0;color:var(--md-primary);font-size:12.5px;font-weight:500;padding:0 12px;height:44px;white-space:nowrap;border-radius:999px}
.sheet .sub{color:var(--md-on-surface-variant);font-size:12px;margin-top:1px}
.sheet td.num,.sheet th.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet-tools{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sheet-tools .sum{margin-left:auto;font-size:13px;color:var(--md-on-surface-variant)}
.bulk{margin-top:10px;display:grid;gap:8px;padding:12px;border:1px dashed var(--md-outline);border-radius:var(--sh-md);background:var(--md-surface-container-low)}
.bulk textarea{font:inherit;font-family:var(--mono);font-size:12.5px;padding:10px;border:1px solid var(--md-outline);border-radius:var(--sh-xs);background:var(--md-surface);color:var(--md-on-surface);min-height:90px;width:100%}
.bulk .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--md-on-surface-variant)}
.sheet-err{color:var(--md-error);font-size:12.5px;margin-top:8px;display:none}
.sheet-err.show{display:block}
.acts-inline{display:flex;gap:6px;align-items:center;white-space:nowrap}
.acts-inline .lbl{font-size:11.5px;color:var(--md-on-surface-variant);margin-right:2px}

/* ===== text fields (MD3 outlined, floating label) ===== */
.field{display:grid;gap:4px;margin-top:16px}
.md-field{position:relative}
.md-field input,.md-field textarea,.md-field select{width:100%;font:inherit;font-size:16px;padding:16px 16px 8px;border:1px solid var(--md-outline);border-radius:var(--sh-xs);background:var(--md-surface);color:var(--md-on-surface);outline:none;min-height:56px;transition:border-color .15s,box-shadow .15s}
.md-field textarea{min-height:96px;resize:vertical}
.md-field label{position:absolute;left:12px;top:17px;padding:0 4px;background:var(--md-surface);color:var(--md-on-surface-variant);font-size:16px;line-height:1.2;pointer-events:none;transition:top .15s,font-size .15s,color .15s;border-radius:4px}

.md-field input:focus + label,.md-field textarea:focus + label,.md-field select:focus + label{color:var(--md-primary)}
.md-field .req{color:var(--md-error);margin-left:2px}

.field .err{font-size:12px;color:var(--md-error);padding:0 16px;display:none}
.field.invalid .err{display:block}

.field.invalid .md-field label{color:var(--md-error)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.agree{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:14px;color:var(--md-on-surface-variant)}

.form{padding:28px;border-radius:var(--sh-lg);background:var(--md-surface);box-shadow:var(--e2)}
.form>h3{font-size:24px;font-weight:500;margin-bottom:4px}
.form .submit{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.form .submit .fine{font-size:12.5px;color:var(--md-on-surface-variant)}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:10px}
.linkbox input{flex:1;font-family:var(--mono);font-size:13px;padding:10px 12px;border:1px solid var(--md-outline);border-radius:var(--sh-xs);background:var(--md-surface);color:var(--md-on-surface);min-height:44px}
.setting{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--md-on-surface-variant)}
.setting input{width:90px;font:inherit;padding:6px 8px;border:1px solid var(--md-outline);border-radius:var(--sh-xs);background:var(--md-surface);color:var(--md-on-surface);text-align:right;font-variant-numeric:tabular-nums}

/* ===== snackbar ===== */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);padding:14px 16px;border-radius:var(--sh-xs);font-weight:400;font-size:14px;box-shadow:var(--e3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

/* ===== timeline / events ===== */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:14px}
.timeline .t{color:var(--md-on-surface-variant);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-list{margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--md-on-surface-variant);display:grid;gap:4px}
.ev-list li span{font-variant-numeric:tabular-nums;margin-right:8px;color:var(--md-outline)}

/* ===== landing: hero ===== */
.hero{background:linear-gradient(135deg,#062E6F 0%,#0B57D0 42%,#1A73E8 72%,#4285F4 100%);color:#fff;padding:44px 0 52px;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.2fr .9fr;gap:48px;align-items:start;position:relative}

@media (max-width:600px){.hero h1{font-size:32px}}
.hero .sub{color:rgba(255,255,255,.92);font-size:18px;max-width:56ch;line-height:1.65}
.hero .btn-filled{background:#fff;color:#0B57D0}
.hero .btn-tonal{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5)}
.hero .cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}

.phone-mock{margin:0;justify-self:center;text-align:center}

.phone-mock figcaption{color:rgba(255,255,255,.8);font-size:12.5px;margin-top:12px}
@media (max-width:860px){.phone-mock img{max-width:270px}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px;position:relative}
@media (max-width:860px){.facts{grid-template-columns:1fr}}
.facts>div{padding:20px 22px;border-radius:var(--sh-md);background:var(--md-surface-container)}
.facts .v{font-size:30px;font-weight:500;letter-spacing:0;color:var(--md-primary);font-variant-numeric:tabular-nums}
.facts .v small{font-size:14px;color:var(--md-on-surface-variant);font-weight:500;margin-left:4px}
.facts .l{color:var(--md-on-surface-variant);font-size:13.5px;margin-top:2px}

.who .ic{width:40px;height:40px;border-radius:50%;background:var(--md-secondary-container);color:var(--md-on-secondary-container);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}

.who p{color:var(--md-on-surface-variant);font-size:14.5px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
.step{padding:20px;border-radius:var(--sh-md);background:var(--md-surface-container-low);position:relative}
.step .ic{width:40px;height:40px;border-radius:50%;background:var(--md-primary-container);color:var(--md-on-primary-container);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}

.compare{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:stretch}
@media (max-width:860px){.compare{grid-template-columns:1fr}}
.price-card{border-radius:var(--sh-lg);padding:26px 28px;border:1px solid var(--md-outline-variant);background:var(--md-surface)}

.price-card li .msym{font-size:20px;color:var(--md-outline)}

footer{border-top:1px solid var(--md-outline-variant);padding:28px 0;color:var(--md-on-surface-variant);font-size:12.5px;background:var(--md-surface-container-low)}

.stats{display:grid;gap:12px}
.stat{padding:16px 18px;border-radius:var(--sh-md);background:var(--md-surface-container-low)}
.stat .v{font-size:32px;font-weight:500;color:var(--md-primary);letter-spacing:0;line-height:1.1;font-variant-numeric:tabular-nums}

.stat .src{font-size:12px;color:var(--md-on-surface-variant);margin-top:6px}
.stat.one{display:flex;align-items:center;gap:14px;padding:18px 20px}
.stat.one .ic{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--md-primary-container);color:var(--md-on-primary-container);display:inline-flex;align-items:center;justify-content:center}
.stat.one .l{font-size:20px;font-weight:500;line-height:1.35;margin:0;color:var(--md-on-surface)}
@media (max-width:600px){.stat.one .l{font-size:18px}}

@media (max-width:600px){.claim{grid-template-columns:1fr}.claim .big{white-space:normal;font-size:20px}}
.calc{margin-top:28px;border-radius:var(--sh-lg);overflow:hidden;background:var(--md-surface);box-shadow:var(--e2)}

.calc .overlay .big{font-weight:500;font-size:clamp(18px,3vw,36px);color:#1F1F1F;line-height:1.2;text-wrap:balance}

.calc .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px 22px 8px;border-top:1px solid var(--md-outline-variant)}

.bar table.sheet{min-width:0}
.bar .sheet-tools{margin-top:8px}
.bar .field{margin-top:12px}
.bar .submit{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

@media (max-width:600px){.bar .paste{flex-wrap:wrap}.bar .paste>.msym{display:none}.bar .paste input{flex:1 0 100%;padding:0 10px}.btn-go{width:100%;justify-content:center}}

let fxBusy=false,fxTried=false;
async function fxRefresh(manual){const st=S.settings;if(!manual){if(fxTried)return;if(st.fxUpdatedAt&&new Date(st.fxUpdatedAt)>=lastNine())return}fxTried=true;if(fxBusy)return;fxBusy=true;const now=new Date();
  try{let v=null;for(const src of [['https://open.er-api.com/v6/latest/USD',j=>j&&j.rates&&j.rates.KRW,'open.er-api.com'],['https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW',j=>j&&j.rates&&j.rates.KRW,'frankfurter.dev']]){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),5000);const r=await fetch(src[0],{signal:ctl.signal});clearTimeout(t);const j=await r.json();v=src[1](j);if(v){st.fxProvider=src[2];break}}catch(e){}}if(!v)throw new Error('no rate');st.fx=Math.round(v);st.fxUpdatedAt=iso(now);st.fxSource='auto';st.fxError=null;save();if(manual)toast('환율 갱신 · '+st.fx.toLocaleString()+' ('+st.fxProvider+')');if(currentView==='settle')render()}
  catch(e){st.fxError=iso(now);save();if(manual)toast('환율 조회 실패 · 기존 값 유지');if(currentView==='settle')render()}
  finally{fxBusy=false}}

function sheetRowHtml(n,v){v=v||{};return `<tr><td class="n">${n}</td><td><input class="link" name="url" aria-label="리뷰 링크" placeholder="https://maps.app.goo.gl/…" value="${esc(v.url||'')}" autocomplete="off"></td><td><button type="button" class="rm" data-action="rm-row">삭제</button></td></tr>`}
function renumber(){const rows=[...document.querySelectorAll('#sheetBody tr')];rows.forEach((tr,i)=>{tr.querySelector('td.n').textContent=i+1});const s=document.getElementById('sheetSum');if(s)s.textContent=rows.length+'건 · 건당 250,000원 · 지워진 건만 청구'}
function mountOrderForm(){const tb=document.getElementById('sheetBody');if(!tb)return;tb.innerHTML=sheetRowHtml(1);renumber()}
function rowIsEmpty(tr){return [...tr.querySelectorAll('input')].every(i=>!i.value.trim())}
function parseLines(text){return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t|\s{2,}/).map(x=>x.trim());return {url:c[0]||''}}).filter(v=>v.url)}
function addRows(list){const tb=document.getElementById('sheetBody');if(!tb)return;list=list||[{}];const empties=[...tb.querySelectorAll('tr')].filter(rowIsEmpty);list.forEach(v=>{const tr=empties.shift();if(tr&&v.url)tr.querySelector('[name=url]').value=v.url;else if(tr&&!v.url)return;else tb.insertAdjacentHTML('beforeend',sheetRowHtml(0,v))});renumber()}
function barGo(){const inp=document.getElementById('f-link');const err=document.getElementById('barErr');if(!inp||!err)return false;const v=(inp.value||'').trim();err.classList.remove('show');
  if(!v){err.textContent='구글 지도에서 복사한 리뷰 링크를 붙여넣어 주세요.';err.classList.add('show');inp.focus();return false}
  const parts=v.split(/\s+/).filter(Boolean);if(parts.some(x=>!isReviewUrl(x))){err.textContent="구글 지도 리뷰 링크가 아닙니다 (maps.app.goo.gl, google.com/maps 등). 리뷰 옆 더보기 → '리뷰 공유'로 복사한 링크를 넣어 주세요.";err.classList.add('show');inp.focus();return false}
  document.getElementById('barStep').classList.remove('hidden');addRows(parts.map(u=>({url:normUrl(u)})));inp.value='';
  const c=document.getElementById('f-cname');if(c&&!c.value)c.focus();toast(parts.length+'건 추가 · 담당자와 휴대폰만 적으면 접수됩니다');return true}
function submitOrder(form){
  let ok=true;const f=form.elements;
  const step=document.getElementById('barStep');
  const pend=(f.link.value||'').trim();if(pend){if(!barGo())return}
  if(step.classList.contains('hidden')){barGo();return}
  const need=(el,cond)=>{const fld=el.closest('.field');if(!fld)return;fld.classList.toggle('invalid',!cond);if(!cond)ok=false};
  need(f.cname,f.cname.value.trim().length>0);
  need(f.phone,/^01[016789]\d{7,8}$/.test(f.phone.value.replace(/[\s-]/g,'')));
  const revs=[],bad=[];
  [...form.querySelectorAll('#sheetBody tr')].forEach((tr,i)=>{const u=tr.querySelector('[name=url]');const td=u.closest('td');td.classList.remove('invalid');if(rowIsEmpty(tr))return;const val=u.value.trim();if(!isReviewUrl(val)){td.classList.add('invalid');bad.push(i+1);return}revs.push({url:normUrl(val)})});
  const se=document.getElementById('sheetErr');
  if(bad.length){se.textContent=bad.join(', ')+'번 행: 구글 지도 리뷰 링크가 아닙니다 (maps.app.goo.gl, google.com/maps 등).';se.classList.add('show');ok=false}
  else if(!revs.length){se.textContent='리뷰 링크를 1건 이상 붙여넣어 주세요.';se.classList.add('show');ok=false}
  else se.classList.remove('show');
  if(!ok){const first=form.querySelector('.invalid, .sheet-err.show');if(first)first.scrollIntoView({block:'center'});return}
  const id=newOrderId();const when=iso(new Date());const name=f.cname.value.trim();
  S.orders.push({id,business:name,mapsUrl:'',contact:{name,phone:f.phone.value.trim(),email:'',kakao:''},createdAt:when,note:''});
  revs.forEach((r,i)=>{const it={id:id+'-'+(i+1),orderId:id,url:r.url,author:'',snippet:'',status:'requested',workerId:null,createdAt:when,checks:[],events:[],payout:{status:'none'},billing:{status:'none'},returns:0,demo:{gone:true}};ev(it,'requested','접수',when);S.items.push(it)});
  save();location.hash='#/order/done/'+id;
}

/* ---------- view: status (customer) ---------- */
function viewStatus(id){const o=S.orders.find(x=>x.id===id);if(!o)return viewNotFound();const its=itemsOf(o);
  const done=its.filter(i=>i.status==='approved');const unb=done.filter(i=>i.billing.status==='unbilled').length,inv=done.filter(i=>i.billing.status==='invoiced').length,pd=done.filter(i=>i.billing.status==='paid').length;
  const rows=its.map(it=>{let note='';
    if(it.status==='approved')note=`삭제 완료 ${fmtFull(it.approvedAt)} · ${BILL_KO[it.billing.status]}`;
    else if(it.status==='done_claimed')note='지워졌는지 확인 중';
    else if(it.status==='rejected')note=`${esc(it.rejectedReason)} · 비용 없음`;
    else if(it.status==='accepted')note=`작업 중 (${fmtFull(it.acceptedAt)} 시작)`;
    else if(it.status==='assigned')note='작업 중';
    else note='가능 여부 확인 중 (24시간 안에)';
    return `<tr><td class="n">${esc(itemNo(it))}</td><td class="c">${linkA(it.url)}${it.snippet?`<div class="sub">“${esc(it.snippet)}”</div>`:''}</td><td class="c">${esc(it.author)||'<span class="muted">—</span>'}</td><td class="c">${pillKoC(it.status)}</td><td class="c">${note}</td><td class="c num">${it.status==='approved'?krw(PRICE):'<span class="muted">0</span>'}</td></tr>`}).join('');
  const evs=[];its.forEach(it=>it.events.filter(e=>!e.internal).forEach(e=>evs.push({at:e.at,text:'#'+itemNo(it)+' '+e.text})));evs.sort((a,b)=>a.at<b.at?1:-1);
  return topbar('구글 리뷰 삭제',`<span>접수 현황</span>`)+`<div class="wrap" style="padding-top:36px;padding-bottom:60px">
  <div class="eyebrow">접수 현황</div><h2 style="font-size:26px;margin-top:6px">${esc(o.business)}</h2>

function copyTsv(){const g=dbGroups();const list=(g[UI.dbTab]||g.all).slice().sort((a,b)=>a.createdAt<b.createdAt?1:-1);const H=['접수번호','고객','작업자','리뷰 링크','작성자','내용','상태','접수','승인','작업자 결제','고객 청구'];const lines=[H.join('\t')];list.forEach(it=>{const o=orderOf(it);lines.push([it.orderId,o?o.business:'',workerName(it.workerId),it.url,it.author,it.snippet,KO[it.status],fmtFull(it.createdAt),it.approvedAt?fmtFull(it.approvedAt):'',it.status!=='approved'?'':(it.payout.status==='paid'?'결제 완료 '+it.payout.batch:'결제 예정'),it.status!=='approved'?'':BILL_KO[it.billing.status]].map(tsvCell).join('\t'))});const text=lines.join('\n');const done=()=>toast('엑셀에 붙여넣을 수 있게 복사했습니다 · '+(lines.length-1)+'행');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));else fallbackCopy(text,done)}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('복사에 실패했습니다')}document.body.removeChild(ta)}

let currentView='';

const ANCH=['order-form','status-lookup','risk'];
const parseHash=()=>{const h=location.hash||'#/order';const p=h.replace(/^#\/?/,'').split('/');const landing=(p[0]==='order'&&!p[1])||ANCH.includes(p[0])||p[0]==='';return {p,landing,anchor:ANCH.includes(p[0])?p[0]:null}};
function render(){
  const {p,landing,anchor}=parseHash();const app=document.getElementById('app');
  let key='order',html='',view='';
  if(p[0]==='w'&&p[1]){const w=S.workers.find(x=>x.token===dec(p[1]));if(w){sess.set('rr_worker',w.id);location.hash='#/worker';return}key='worker';view='worker';html=viewWorkerLogin('This link is not valid. Ask the admin for a new one.')}
  else if(p[0]==='worker'){key='worker';view='worker';html=viewWorker()}
  else if(p[0]==='settle'){key='settle';view='settle';html=viewSettle();if(isAdmin())fxRefresh(false)}
  else if(p[0]==='status'){view='status';html=viewStatus(dec(p[1]||''))}
  else if(p[0]==='order'&&p[1]==='done'){view='done';html=viewDone(dec(p[2]||''))}
  else{view='landing';html=viewOrder()}
  app.innerHTML=html;currentView=view;
  document.querySelectorAll('#protobar nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===key));
  if(landing){mountOrderForm();const el=anchor?document.getElementById(anchor):null;if(el)el.scrollIntoView();else window.scrollTo(0,0)}
  else window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
  const selVal=key=>{const s=document.querySelector('select[data-assign="'+key+'"]');return s?s.value:null};
  if(a==='reset')reset();
  else if(a==='bar-go')barGo();
  else if(a==='ack')ack(id);else if(a==='claim')claim(id);else if(a==='reject')reject(id);
  else if(a==='assign')assign(id,selVal(id));else if(a==='assign-order')assignOrder(b.dataset.oid,selVal('o:'+b.dataset.oid));
  else if(a==='approve')approve(id);else if(a==='return')returnItem(id);else if(a==='pay-worker')markPaidWorker(id);else if(a==='check-auto')checkAuto();
  else if(a==='wtab'){UI.workerTab=b.dataset.tab;render()}
  else if(a==='dbtab'){UI.dbTab=b.dataset.tab;render()}
  else if(a==='invoice')invoiceOrder(b.dataset.oid);else if(a==='paid')paidOrder(b.dataset.oid);
  else if(a==='copy-tsv')copyTsv();
  else if(a==='w-reset')resetWorkerPw(id);
  else if(a==='worker-logout'){sess.del('rr_worker');render()}
  else if(a==='admin-logout'){sess.del('rr_admin');render()}
  else if(a==='fx-refresh'){b.disabled=true;b.textContent='갱신 중…';fxRefresh(true)}
  else if(a==='add-row'){addRows([{}]);const rows=document.querySelectorAll('#sheetBody tr');rows[rows.length-1].querySelector('input').focus()}
  else if(a==='rm-row'){const tb=document.getElementById('sheetBody');if(tb.querySelectorAll('tr').length>1)b.closest('tr').remove();else b.closest('tr').querySelectorAll('input').forEach(i=>i.value='');renumber()}
  else if(a==='toggle-bulk'){const box=document.getElementById('bulkBox');box.classList.toggle('hidden');if(!box.classList.contains('hidden'))document.getElementById('bulkText').focus()}
  else if(a==='bulk-add'){const ta=document.getElementById('bulkText');const list=parseLines(ta.value);if(!list.length){toast('붙여넣은 링크가 없습니다');return}addRows(list);ta.value='';document.getElementById('bulkBox').classList.add('hidden');toast(list.length+'행을 표에 추가했습니다')}
  else if(a==='copy'){const inp=document.getElementById(b.dataset.target);inp.select();const done=()=>toast('복사했습니다');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(done,()=>fallbackCopy(inp.value,done));else fallbackCopy(inp.value,done)}
});
